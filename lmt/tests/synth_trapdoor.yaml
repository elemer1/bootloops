agreement: synth_trapdoor
rules:
- {id: c.contrib, kind: characterization, action: transfer, forms: [contribution], triggers: [investments, dispositions],
   cite: {clause: "def:Investment", quote: "any contribution of property to the capital of another Person"}}
- {id: "1.1", kind: na, reason: lead-in, cite: {clause: "1.1", quote: "Make any Investment, except"}}
- {id: "1.1(a)", kind: exception, category: investments, action: transfer, actor: [borrower, guarantor], counterparty: [borrower, guarantor],
   assets: [any], capacity: unlimited, cite: {clause: "1.1(a)", quote: "Investments by any Loan Party in any other Loan Party"}}
- {id: "1.1(b)", kind: exception, category: investments, action: transfer, actor: [borrower, guarantor], counterparty: [nlp_rs],
   assets: [any], capacity: capped, capacity_note: "$10,000,000", cite: {clause: "1.1(b)", quote: "Investments by any Loan Party in any Non-Loan Party that is a Restricted Subsidiary"}}
- {id: "1.1(c)", kind: exception, category: investments, action: transfer, actor: [nlp_rs], counterparty: [any],
   assets: [any], capacity: unlimited, funded_by: ["1.1(b)"],
   cite: {clause: "1.1(c)", quote: "to the extent financed with the proceeds of Investments made pursuant to clause (b)"}}
- {id: "1.2", kind: na, reason: lead-in, cite: {clause: "1.2", quote: "Make any Disposition, except"}}
- {id: "1.2(a)", kind: exception, category: dispositions, action: transfer, actor: [any], counterparty: [any], assets: [any],
   capacity: unlimited, via: {category: investments}, cite: {clause: "1.2(a)", quote: "Dispositions permitted by Section 1.1"}}
- {id: "1.3", kind: effect, on: transfer, when: {counterparty: [nlp_rs, unrestricted]}, then: release_lien,
   cite: {clause: "1.3", quote: "transferred to a Person that is not a Loan Party in a transaction permitted hereunder are automatically released"}}
