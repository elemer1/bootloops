# Scenario facts for the 2016 backtest. Each fact turns off rules whose free-text
# condition is known false for THIS asset and THIS transaction. Facts are ours, not the
# encoders'; each cites its source.
facts:
- pattern: "BrandTwo"
  holds: false
  why: >-
    The tracked asset is the main-brand trademark collateral (a 72.04% undivided interest),
    not the separately defined second-brand business. Source: Eaton Vance Mgmt. v. J. Crew
    Group (N.Y. Sup. Ct., Index No. 654397/2017, complaint filed 2017-06-22), paras. 58-60.
- pattern: "Securitization"
  holds: false
  why: "No securitization financing is part of the transaction (same source)."

# Status of typed conditions for THIS transaction (first matching pattern wins). Status is what the
# sources show, not what would make the path work: no source -> unknown or assumed, never proven.
condition_status:
- pattern: "intercompany loans under this clause evidenced by notes"
  status: proven
  why: "Inapplicable to this step: each transfer was a contribution to equity capital, not an intercompany loan."
  source: "Complaint, Index No. 654397/2017, para. 59 (Ocean Tomo letter: 'each transfer represented a contribution to equity capital')"
- pattern: "Available Amount portion: no Event of Default"
  status: assumed
  why: >-
    No source reviewed shows an Event of Default continuing on 2016-12-05; the lenders later alleged
    that the transfer itself caused Defaults (complaint para. 81). Not verified either way.
  source: "none establishing the condition"
- pattern: "Total Leverage Ratio <= 6\\.0"
  status: unknown
  why: "The Total Leverage Ratio on a Pro Forma Basis at the relevant date is not established from verified sources."
  source: "none"
- pattern: "(CFO|Responsible Officer|officer) certificate"
  status: unknown
  why: "No evidence reviewed that the certificate this basket requires was delivered."
  source: "none"

aa_parameter: available_amount

# Capacity ledger inputs (US dollars). Total Assets at 2016-10-29 were $1,499,306,000
# (J.Crew Group 10-Q, accession 0001564590-16-029583, via SEC XBRL), so every
# percentage prong is below its dollar floor and the floors govern.
capacity:
  pools:
    c_iv_floor: 150000000      # 7.02(c)(iv)(B)(x): greater of $150,000,000 and 4.00% of Total Assets (~$60.0M)
    n_floor: 100000000         # 7.02(n)(i): greater of $100,000,000 and 3.25% of Total Assets (~$48.7M)
    i_B_floor: 75000000        # 7.02(i)(B)(i): greater of $75,000,000 and 2.50% of Total Assets (~$37.5M)
    available_amount: null     # UNKNOWN; queried as a parameter (aa_parameter below), not an input.
                               # For comparison only: under the basket combination and other inputs
                               # used here, $27M is the value implied by the company's asserted ~$277M
                               # aggregate capacity under 7.02(c)(iv) and (n) (complaint para. 82). It is
                               # not an independently verified AA amount and not a lower bound.
  rule_pools:
    "7.02(c)(iv)": [c_iv_floor, available_amount]
    "7.02(n)": [n_floor, available_amount]
    "7.02(n).designate": [n_floor, available_amount]
    "7.02(i).nlp": [i_B_floor, available_amount]
  values:
    company_certified: 250000000   # 72.04% of $347M (complaint paras. 59-60, 82)
    full_trademark: 347000000      # Ocean Tomo value of the entire Trademark Collateral (complaint para. 60)
