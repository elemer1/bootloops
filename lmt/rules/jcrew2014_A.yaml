agreement: jcrew2014
rules:
- id: char.contribution.investment
  kind: characterization
  action: transfer
  forms:
  - contribution
  triggers: &id001
  - investments
  - dispositions
  cite:
    clause: def:Investment
    quote: a loan, advance or capital contribution to
- id: char.contribution.disposition
  kind: characterization
  action: transfer
  forms:
  - contribution
  triggers: *id001
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
  note: A contribution moves property out of the contributor, so it is also a Disposition.
- id: char.sale.disposition
  kind: characterization
  action: transfer
  forms:
  - sale
  triggers:
  - dispositions
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
  note: A sale for fair-market-value consideration is not by itself an Investment by the seller under def:Investment.
- id: char.license.disposition
  kind: characterization
  action: transfer
  forms:
  - license
  triggers:
  - dispositions
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
- id: char.dividend.rp
  kind: characterization
  action: transfer
  forms:
  - dividend
  triggers: &id002
  - restricted_payments
  - dispositions
  cite:
    clause: def:Restricted Payment
    quote: any dividend or other distribution (whether in cash, securities or other property) with respect to any Equity Interest of Holdings, the Borrower or any of its Restricted Subsidiaries
- id: char.dividend.disposition
  kind: characterization
  action: transfer
  forms:
  - dividend
  triggers: *id002
  cite:
    clause: def:Disposition
    quote: other disposition
  note: A distribution of property is also a transfer/other disposition of that property.
- id: char.designate.investment
  kind: characterization
  action: designate
  triggers:
  - designation
  - investments
  cite:
    clause: '6.14'
    quote: The designation of any Subsidiary as an Unrestricted Subsidiary shall constitute an Investment by the Borrower therein
- id: char.designate.def
  kind: characterization
  action: designate
  triggers:
  - designation
  - investments
  cite:
    clause: def:Unrestricted Subsidiary
    quote: designated by the board of directors of the Borrower as an Unrestricted Subsidiary pursuant to Section 6.14
- id: '6.11'
  kind: na
  reason: lead-in to further-assurances covenant; operative lien-attachment terms encoded under 6.11(a)
  cite:
    clause: '6.11'
    quote: Covenant to Guarantee Obligations and Give Security
- id: 6.11(a).transfer
  kind: effect
  'on': transfer
  when:
    counterparty:
    - holdings
    - borrower
    - guarantor
  then: attach_lien
  cite:
    clause: 6.11(a)
    quote: upon the acquisition of any material assets by the Borrower or any other Loan Party
  note: Only material assets, subject to the exclusions in the Collateral and Guarantee Requirement.
- id: 6.11(a).designate
  kind: effect
  'on': designate
  when:
    counterparty:
    - guarantor
  then: attach_lien
  cite:
    clause: 6.11(a)
    quote: the designation in accordance with Section 6.14, of any existing direct or indirect wholly owned Material Domestic Subsidiary as a Restricted Subsidiary
  note: Re-designation of an Unrestricted Subsidiary as Restricted; only if it is a wholly owned Material Domestic Subsidiary that is not an Excluded Subsidiary.
- id: C&GR.attach
  kind: effect
  'on': transfer
  when:
    counterparty:
    - borrower
    - guarantor
  then: attach_lien
  cite:
    clause: def:Collateral and Guarantee Requirement
    quote: substantially all tangible and intangible personal property of the Borrower and each Guarantor
  note: Subject to the listed exclusions (deposit accounts, Securitization Assets, cost/benefit carve-out).
- id: 6.11(b)
  kind: na
  reason: post-closing Schedule 1.01A items and Material Real Property mortgages; no modeled inter-entity transfer beyond 6.11(a)
  cite:
    clause: 6.11(b)
    quote: the Borrower shall obtain the security interests and Guarantees set forth on Schedule 1.01A
- id: '6.14'
  kind: exception
  category: designation
  action: designate
  actor:
  - borrower
  counterparty:
  - guarantor
  - nlp_rs
  foreign: any
  capacity: unlimited
  conditions:
  - no Default immediately before and after designation
  - Total Leverage Ratio <= 6.0:1.0 on a Pro Forma Basis (not required for a Securitization Subsidiary designated for a Qualified Securitization Financing), with officer certificate
  - designated Subsidiary would not be a Restricted Subsidiary for the ABL Facilities, the Senior Notes, any other Junior Financing or any other Indebtedness of any Loan Party
  - not previously re-designated from Unrestricted to Restricted
  via: null
  cite:
    clause: '6.14'
    quote: The board of directors of the Borrower may at any time designate any Restricted Subsidiary as an Unrestricted Subsidiary
  note: Designation is also an Investment by the Borrower at fair market value (see char.designate.investment); needs an investments basket.
- id: '7.01'
  kind: na
  reason: lead-in to liens covenant; modeled transfers/designations do not create Liens
  cite:
    clause: '7.01'
    quote: SECTION 7.01. Liens.
