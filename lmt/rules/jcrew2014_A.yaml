- id: 7.01(v)
  kind: na
  reason: ground leases
  cite:
    clause: 7.01(v)
    quote: ground leases in respect of real property
- id: 7.01(w)
  kind: na
  reason: precautionary filings
  cite:
    clause: 7.01(w)
