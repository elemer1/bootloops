    quote: Liens securing obligations in respect of Indebtedness permitted under Section 7.03(r)(i)
- id: 7.01(z)
  kind: na
  reason: securitization liens and clauses (aa)-(gg) (zoning, renewals, refinancing liens on Collateral, card processor
