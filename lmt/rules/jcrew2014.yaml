agreement: jcrew2014
provenance:
  base: rules/jcrew2014_B.yaml (encoder B)
  compared_with: rules/jcrew2014_A.yaml (encoder A)
  adjudication: ADJUDICATION.md
assumptions:
  A1: '7.02(t): an Investment of property (here IP) that the Non-Loan-Party Restricted Subsidiary itself received
    as an in-kind Investment under 7.02(c)(iv), (i)(B) or (n) is "financed with the proceeds received" from that
    Investment.'
  A2: '7.02(i): an intra-group contribution of property to a wholly owned Restricted Subsidiary is a "purchase or
    other acquisition" (a Permitted Acquisition).'
  A3: '7.02(c)(ii)/(iii): "Non-Loan Party" (any Subsidiary that is not a Loan Party) includes Unrestricted Subsidiaries
    as the investing party.'
rules:
- id: char.contribution.investment
  kind: characterization
  action: transfer
  forms:
  - contribution
  triggers:
  - investments
  - dispositions
  note: Also a Disposition (transfer of property), see char.contribution.disposition.
  cite:
    clause: def:Investment
    quote: a loan, advance or capital contribution to
- id: char.contribution.disposition
  kind: characterization
  action: transfer
  forms:
  - contribution
  triggers:
  - investments
  - dispositions
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
- id: char.dividend.rp
  kind: characterization
  action: transfer
  forms:
  - dividend
  triggers:
  - restricted_payments
  - dispositions
  note: Only distributions on equity of Holdings, the Borrower or a Restricted Subsidiary are Restricted Payments;
    a distribution by an Unrestricted Subsidiary is not.
  cite:
    clause: def:Restricted Payment
    quote: any dividend or other distribution (whether in cash, securities or other property) with respect to any
      Equity Interest of Holdings, the Borrower or any of its Restricted Subsidiaries
- id: char.dividend.disposition
  kind: characterization
  action: transfer
  forms:
  - dividend
  triggers:
  - restricted_payments
  - dispositions
  note: A distribution of property is a 'transfer ... or other disposition' of property; 7.05(e) imports 7.06 permissions.
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
- id: char.sale
  kind: characterization
  action: transfer
  forms:
  - sale
  triggers:
  - dispositions
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
- id: char.sale.equity_issuance
  kind: characterization
  action: transfer
  forms:
  - sale
  triggers:
  - dispositions
  cite:
    clause: def:Disposition
    quote: any sale or issuance of Equity Interests in a Restricted Subsidiary
- id: char.license
  kind: characterization
  action: transfer
  forms:
  - license
  triggers:
  - dispositions
  cite:
    clause: def:Disposition
    quote: the sale, transfer, license, lease or other disposition
- id: char.designate
  kind: characterization
  action: designate
  triggers:
  - designation
  - investments
  cite:
    clause: '6.14'
    quote: The designation of any Subsidiary as an Unrestricted Subsidiary shall constitute an Investment by the
      Borrower therein
- id: 6.11.attach
  kind: effect
  'on': transfer
  when:
    counterparty:
    - holdings
    - borrower
    - guarantor
  then: attach_lien
  note: Covenant to keep the Collateral and Guarantee Requirement satisfied; operative steps in 6.11(a)/(b).
  cite:
    clause: '6.11'
    quote: ensure that the Collateral and Guarantee Requirement continues to be satisfied
- id: 6.11(a).acquisition
  kind: effect
  'on': transfer
  when:
    counterparty:
    - holdings
    - borrower
    - guarantor
  then: attach_lien
  note: Lien must be granted on material assets acquired by a Loan Party, subject to the Collateral and Guarantee
    Requirement (Holdings' grant per that definition).
  cite:
    clause: 6.11(a)
    quote: upon the acquisition of any material assets by the Borrower or any other Loan Party
- id: 6.11(a).redesignation
  kind: effect
  'on': designate
  when:
    counterparty:
    - guarantor
  then: attach_lien
  note: Applies only to re-designation of an Unrestricted Subsidiary as Restricted where it is a wholly owned Material
    Domestic Subsidiary that must become a Guarantor.
  cite:
    clause: 6.11(a)
    quote: the designation in accordance with Section 6.14, of any existing direct or indirect wholly owned Material
      Domestic Subsidiary as a Restricted Subsidiary
- id: 6.11(b).real_property
  kind: effect
  'on': transfer
  when:
    counterparty:
    - borrower
    - guarantor
  then: attach_lien
  note: Real property only (asset type other); Holdings excluded. 6.11(b)(i) concerns Schedule 1.01A post-closing
    items.
  cite:
    clause: 6.11(b)
    quote: promptly after the acquisition of any Material Real Property by any Loan Party other than Holdings
- id: def:CGR.attach
  kind: effect
  'on': transfer
  when:
    counterparty:
    - holdings
    - borrower
    - guarantor
  then: attach_lien
  note: Holdings is listed among those giving the guarantee ('each, a "Guarantor"'); Excluded Subsidiaries (incl.
    Foreign Subsidiaries, non-wholly owned, Unrestricted) need not be Guarantors. Equity of first-tier Foreign Subsidiaries
    pledged only 65%.
  cite:
    clause: def:Collateral and Guarantee Requirement
    quote: substantially all tangible and intangible personal property of the Borrower and each Guarantor
- id: '6.14'
  kind: exception
  category: designation
  action: designate
  actor:
  - borrower
  counterparty:
  - guarantor
  - nlp_rs
  foreign: any
  capacity: unlimited
  conditions:
  - immediately before and after such designation, no Default
  - Total Leverage Ratio <= 6.0 to 1.0 on a Pro Forma Basis, with officer certificate (not required for designating
    a Securitization Subsidiary in connection with a Qualified Securitization Financing)
  - entity would not be a 'Restricted Subsidiary' for the ABL Facilities, the Senior Notes, any other Junior Financing
    or any other Indebtedness of any Loan Party
  - entity has not previously been re-designated from Unrestricted to Restricted (no subsequent re-designation)
  - designation is an Investment by the Borrower at fair market value and must be permitted under 7.02
  note: Re-designation of an Unrestricted Subsidiary as Restricted is also permitted (deemed incurrence of its Indebtedness/Liens);
    not modeled as an action.
  cite:
    clause: '6.14'
    quote: The board of directors of the Borrower may at any time designate any Restricted Subsidiary as an Unrestricted
      Subsidiary
- id: '7.01'
  kind: na
  reason: Lien covenant lead-in; transfers/designations do not themselves create Liens
  cite:
    clause: '7.01'
    quote: Create, incur, assume or suffer to exist any Lien
- id: 7.01(a)
  kind: na
  reason: the lenders' own Liens under Loan Documents; permits no inter-entity asset movement
  cite:
    clause: 7.01(a)
    quote: Liens created pursuant to any Loan Document
- id: 7.01(b)
  kind: na
  reason: scheduled existing Liens
  cite:
    clause: 7.01(b)
    quote: Liens existing on the date hereof and set forth on Schedule 7.01(b)
- id: 7.01(c)
  kind: na
  reason: tax liens; no inter-entity asset movement
  cite:
    clause: 7.01(c)
    quote: Liens for taxes
- id: 7.01(d)
  kind: na
  reason: statutory/landlord liens
  cite:
    clause: 7.01(d)
    quote: statutory or common law Liens of landlords
- id: 7.01(e)
  kind: na
  reason: workers' comp/insurance pledges
  cite:
    clause: 7.01(e)
    quote: pledges or deposits in the ordinary course of business in connection with workers’ compensation
- id: 7.01(f)
  kind: na
  reason: performance deposits
  cite:
    clause: 7.01(f)
    quote: deposits to secure the performance of bids
- id: 7.01(g)
  kind: na
