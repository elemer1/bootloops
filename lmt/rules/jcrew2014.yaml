- id: 7.02(c)(i)(B)
  kind: exception
  category: investments
  action: transfer
  actor:
  - borrower
  - guarantor
  counterparty:
  - borrower
  - guarantor
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  cite:
    clause: 7.02(c)
    quote: the Borrower or any Restricted Subsidiary that is a Loan Party in the Borrower or any Restricted Subsidiary
      that is a Loan Party
- id: 7.02(c)(ii)
  kind: exception
  category: investments
  action: transfer
  actor:
  - nlp_rs
  counterparty:
  - nlp_rs
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  note: '''Non-Loan Party'' is any Subsidiary that is not a Loan Party, so literally includes Unrestricted Subsidiaries
    as investors.'
  cite:
    clause: 7.02(c)
    quote: by any Non-Loan Party in any other Non-Loan Party that is a Restricted Subsidiary
- id: 7.02(c)(ii).unrestricted_actor
  kind: exception
  category: investments
  action: transfer
  actor:
  - unrestricted
  counterparty:
  - nlp_rs
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  note: 'ADJUDICATION: "Non-Loan Party" is defined as any Subsidiary that is not a Loan Party; whether it reaches
    Unrestricted Subsidiaries as investors (A3).'
  cite:
    clause: 7.02(c)
    quote: by any Non-Loan Party in any other Non-Loan Party that is a Restricted Subsidiary
  assumption: A3
- id: 7.02(c)(iii)
  kind: exception
  category: investments
  action: transfer
  actor:
  - nlp_rs
  counterparty:
  - borrower
  - guarantor
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  cite:
    clause: 7.02(c)
    quote: by any Non-Loan Party in the Borrower or any Restricted Subsidiary that is a Loan Party
- id: 7.02(c)(iii).unrestricted_actor
  kind: exception
  category: investments
  action: transfer
  actor:
  - unrestricted
  counterparty:
  - borrower
  - guarantor
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  cite:
    clause: 7.02(c)
    quote: by any Non-Loan Party in the Borrower or any Restricted Subsidiary that is a Loan Party
  assumption: A3
  note: 'ADJUDICATION: "Non-Loan Party" is defined as any Subsidiary that is not a Loan Party; whether it reaches
    Unrestricted Subsidiaries as investors (A3).'
- id: 7.02(c)(iv)
