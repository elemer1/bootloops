  cite:
    clause: 7.02(g)
    quote: Investments in Swap Contracts permitted under Section 7.03
- id: 7.02(h)
  kind: exception
  category: investments
  action: transfer
  actor: *id001
  counterparty:
  - any
  assets:
  - any
  forms:
  - sale
  foreign: any
  capacity: unlimited
  conditions: []
  via:
    category: dispositions
    except: []
  note: Covers only consideration received on a permitted Disposition; limited to sales.
  cite:
    clause: 7.02(h)
    quote: promissory notes and other non-cash consideration that is permitted to be received in connection with
      Dispositions permitted by Section 7.05
- id: 7.02(i).lp
  kind: exception
  category: investments
  action: transfer
  actor:
  - holdings
  - borrower
  - guarantor
  - nlp_rs
  counterparty:
  - borrower
  - guarantor
  assets:
  - any
  forms:
  - contribution
  - sale
  foreign: any
  capacity: unlimited
  conditions:
  - acquired property constitutes Collateral and acquired/created Subsidiary becomes a Guarantor and complies with
    Section 6.11
  - acquired business permitted under Section 7.07
  - no Default immediately before and after
  - Total Leverage Ratio <= 6.0 to 1.0 on a Pro Forma Basis with CFO certificate
  - Responsible Officer certificate
  - counterparty is (or becomes) wholly owned
  note: 'Permitted Acquisition. Whether an intra-group capital contribution in exchange for equity is a ''purchase
    or other acquisition'' is a reading choice. | ADJUDICATION: whether an intra-group contribution is a "purchase
    or other acquisition" (A2).'
  cite:
    clause: 7.02(i)
    quote: Equity Interests in a Person that, upon the consummation thereof, will be a wholly owned Restricted Subsidiary
      of the Borrower
  assumption: A2
- id: 7.02(i).nlp
  kind: exception
  category: investments
  action: transfer
  actor:
  - holdings
  - borrower
  - guarantor
  counterparty:
  - nlp_rs
  assets:
  - any
  forms:
  - contribution
  - sale
  foreign: any
  capacity: capped
  capacity_note: greater of $75,000,000 and 2.50% of Total Assets, plus the Available Amount (if positive), at any
    time outstanding
  conditions:
  - acquired business permitted under Section 7.07
  - no Default immediately before and after
  - Total Leverage Ratio <= 6.0 to 1.0 on a Pro Forma Basis with CFO certificate
  - Responsible Officer certificate
  - counterparty is (or becomes) a wholly owned Restricted Subsidiary
  note: 'Permitted Acquisition clause (B) basket for Persons that do not become Loan Parties. | ADJUDICATION: whether
    an intra-group contribution is a "purchase or other acquisition" (A2).'
  cite:
    clause: 7.02(i)
    quote: the aggregate amount of Investments made by the Loan Parties in Persons that do not become Loan Parties
      shall not exceed
  assumption: A2
- id: 7.02(i).nlp_actor
  kind: exception
  category: investments
  action: transfer
  actor:
  - nlp_rs
