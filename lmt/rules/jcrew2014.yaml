release_requires:
  '9.11': SA.
out_of_scope:
  '2.03': Mandatory prepayment from asset-sale proceeds; affects where sale proceeds go, not whether a transfer
    is permitted. Not modeled.
  '6.01': Financial-statement delivery; referenced by 6.14 for the leverage test. Treated as a condition, assumed
    satisfiable.
  '6.13': Further assurances/post-closing; procedural. Not modeled.
  '7.03': Indebtedness covenant. Phase 0 tracks asset transfers, not debt incurrence; cross-references from 7.01/7.02/7.06
    treated through their own clauses. Needed for uptier/priming cases (Phase 1+).
  '7.04': Fundamental changes (mergers, consolidations, all-or-substantially-all dispositions). Merger routes are
    NOT modeled; a merger could be an additional path. Phase 1.
  '7.07': Change in nature of business; a condition of 7.02(i) Permitted Acquisitions, assumed satisfiable.
  '7.08': MATERIAL GAP. Transactions with Affiliates. The lenders' complaint (Index No. 654397/2017, para. 81) alleged
    the transfer violated 7.02, 7.05 AND 7.08. Not encoded in Phase 0; an affiliate-terms guard on transfers to
    Unrestricted Subsidiaries could remove paths. First item for Phase 1, via the same blind dual-encoding protocol.
  '7.12': Prepayments of junior debt; condition inside 7.06(k). Not modeled.
  '8.01': Events of Default; referenced by 7.01(h) (judgment liens). Not modeled.
  '10.01': Amendments/consents; 9.11(a)(iii) lien release by Required Lenders vote is not a borrower action and
    is not modeled (needed for uptier cases).
