  category: investments
  action: transfer
  actor:
  - holdings
  - borrower
  - guarantor
  counterparty:
  - nlp_rs
  assets:
  - any
  foreign: any
  capacity: capped
  capacity_note: greater of $150,000,000 and 4.00% of Total Assets, plus the Available Amount (if positive), at
    any time outstanding
  conditions:
  - intercompany loans under this clause evidenced by notes pledged to the Collateral Agent
  cite:
    clause: 7.02(c)
    quote: by any Loan Party in any Non-Loan Party that is a Restricted Subsidiary
- id: 7.02(d)
  kind: na
  reason: trade credit receivables
  cite:
    clause: 7.02(d)
    quote: extensions of credit in the nature of accounts receivable
- id: 7.02(e).dispositions
  kind: exception
  category: investments
  action: transfer
  actor: &id001
  - holdings
  - borrower
  - guarantor
  - nlp_rs
  counterparty:
  - any
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  via:
    category: dispositions
    except:
    - 7.05(d)(ii)
    - 7.05(e).investments
    - 7.05(e).rp
  note: Investments consisting of Dispositions permitted by 7.05 other than 7.05(d)(ii) or (e). Liens (7.01), Indebtedness
    (7.03) and fundamental changes (7.04) cross-references not modeled.
  cite:
    clause: 7.02(e)
    quote: Investments consisting of Liens, Indebtedness, fundamental changes, Dispositions and Restricted Payments
      permitted under Sections 7.01
- id: 7.02(e).rp
  kind: exception
  category: investments
  action: transfer
  actor: *id001
  counterparty:
  - any
  assets:
  - any
  foreign: any
  capacity: unlimited
  conditions: []
  via:
    category: restricted_payments
    except:
    - 7.06(d)
    - 7.06(g)(iv)
  note: Investments consisting of Restricted Payments permitted by 7.06 other than 7.06(d) or (g)(iv).
  cite:
    clause: 7.02(e)
    quote: 7.06 (other than Section 7.06(d) or (g)(iv))
- id: 7.02(f)
