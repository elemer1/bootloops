    transfers
  cite:
    clause: 7.01(z)
    quote: Liens on the Securitization Assets arising in connection with a Qualified Securitization Financing
- id: '7.02'
  kind: na
  reason: Investments covenant lead-in; permissions encoded per clause
  cite:
    clause: '7.02'
    quote: Make or hold any Investments, except
- id: 7.02(a)
  kind: na
  reason: investments in Cash Equivalents (third-party instruments), not intra-group
  cite:
    clause: 7.02(a)
    quote: Investments by Holdings, the Borrower or any of the Restricted Subsidiaries in assets that are Cash Equivalents
- id: 7.02(b)
  kind: na
